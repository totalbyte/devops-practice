apiVersion: v1
kind: Service
metadata:
  name: mailhog
  namespace: antoniuk
  labels:
    app.kubernetes.io/name: mailhog
    app.kubernetes.io/part-of: relativa
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mailhog
  ports:
    - name: smtp
      port: 1025
      targetPort: smtp
    - name: http
      port: 8025
      targetPort: http
