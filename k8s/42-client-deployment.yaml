apiVersion: apps/v1
kind: Deployment
metadata:
  name: client
  namespace: antoniuk
  labels:
    app.kubernetes.io/name: client
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: relativa
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: client
  template:
    metadata:
      labels:
        app.kubernetes.io/name: client
        app.kubernetes.io/component: frontend
        app.kubernetes.io/part-of: relativa
    spec:
      containers:
        - name: client
          image: ghcr.io/totalbyte/relativa-client:1.0.0
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: VITE_GATEWAY_URL
              valueFrom:
                configMapKeyRef:
                  name: relativa-config
                  key: VITE_GATEWAY_URL
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
