apiVersion: batch/v1
kind: Job
metadata:
  name: migration
  namespace: antoniuk
  labels:
    app.kubernetes.io/name: migration
    app.kubernetes.io/component: db-migration
    app.kubernetes.io/part-of: relativa
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: migration
        app.kubernetes.io/component: db-migration
        app.kubernetes.io/part-of: relativa
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          command: ["sh", "-c", "until pg_isready -h \"$DB_HOST\" -p \"$DB_PORT\"; do sleep 2; done"]
          envFrom:
            - configMapRef:
                name: relativa-config
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
      containers:
        - name: migration
          image: ghcr.io/totalbyte/relativa-migration:1.0.0
          envFrom:
            - configMapRef:
                name: relativa-config
          env:
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: relativa-secrets
                  key: DB_PASS
            - name: ConnectionStrings__Default
              value: Host=$(DB_HOST);Port=$(DB_PORT);Database=$(DB_NAME);Username=$(DB_USER);Password=$(DB_PASS)
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
