apiVersion: v1
kind: ConfigMap
metadata:
  name: relativa-config
  namespace: antoniuk
  labels:
    app.kubernetes.io/part-of: relativa
data:
  ASPNETCORE_ENVIRONMENT: Development
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_NAME: relativa
  DB_USER: relativa
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: "5672"
  RABBITMQ_USER: relativa
  JWT_ISSUER: relativa-auth
  JWT_AUDIENCE: relativa
  SMTP_HOST: mailhog
  SMTP_PORT: "1025"
  SMTP_FROM_ADDRESS: noreply@relativa.com
  SMTP_FROM_NAME: Relativa
  SMTP_USE_SSL: "false"
  APP_FRONTEND_BASE_URL: http://relativa.local
  CORS_ORIGIN: http://relativa.local
  GATEWAY_PUBLIC_URL: http://api.relativa.local
  VITE_GATEWAY_URL: http://api.relativa.local
