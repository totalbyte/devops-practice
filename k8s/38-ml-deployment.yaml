apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml
  namespace: antoniuk
  labels:
    app.kubernetes.io/name: ml
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: relativa
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: ml
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ml
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: relativa
    spec:
      serviceAccountName: migration-waiter
      initContainers:
        - name: wait-for-migration
          image: registry.k8s.io/kubectl:v1.37.1
          args: ["wait", "--for=condition=complete", "job/migration", "--timeout=10m"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
        - name: wait-for-rabbitmq
          image: busybox:1.37
          command: ["sh", "-c", "until nc -z \"$RABBITMQ_HOST\" \"$RABBITMQ_PORT\"; do sleep 2; done"]
          envFrom:
            - configMapRef:
                name: relativa-config
          resources:
            requests:
              cpu: 10m
              memory: 8Mi
            limits:
              cpu: 50m
              memory: 16Mi
      containers:
        - name: ml
          image: ghcr.io/totalbyte/relativa-ml:1.0.0
          ports:
            - name: http
              containerPort: 8084
          envFrom:
            - configMapRef:
                name: relativa-config
          env:
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: relativa-secrets
                  key: DB_PASS
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: relativa-secrets
                  key: RABBITMQ_PASS
            - name: DJANGO_SETTINGS_MODULE
              value: relativa_ml.settings
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 768Mi
          readinessProbe:
            httpGet:
              path: /api/ml/health/
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/ml/health/
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
