apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  namespace: antoniuk
  labels:
    app.kubernetes.io/name: auth
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: relativa
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: auth
  template:
    metadata:
      labels:
        app.kubernetes.io/name: auth
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: relativa
    spec:
      serviceAccountName: migration-waiter
      initContainers:
        - name: wait-for-migration
          image: registry.k8s.io/kubectl:v1.37.1
          args: ["wait", "--for=condition=complete", "job/migration", "--timeout=10m"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
        - name: wait-for-rabbitmq
          image: busybox:1.37
          command: ["sh", "-c", "until nc -z \"$RABBITMQ_HOST\" \"$RABBITMQ_PORT\"; do sleep 2; done"]
          envFrom:
            - configMapRef:
                name: relativa-config
          resources:
            requests:
              cpu: 10m
              memory: 8Mi
            limits:
              cpu: 50m
              memory: 16Mi
      containers:
        - name: auth
          image: ghcr.io/totalbyte/relativa-auth:1.0.0
          ports:
            - name: http
              containerPort: 8081
          envFrom:
            - configMapRef:
                name: relativa-config
          env:
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: relativa-secrets
                  key: DB_PASS
            - name: RABBITMQ_PASS
              valueFrom:
                secretKeyRef:
                  name: relativa-secrets
                  key: RABBITMQ_PASS
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: relativa-secrets
                  key: JWT_SECRET
            - name: ASPNETCORE_URLS
              value: http://+:8081
            - name: ConnectionStrings__Default
              value: Host=$(DB_HOST);Port=$(DB_PORT);Database=$(DB_NAME);Username=$(DB_USER);Password=$(DB_PASS)
            - name: Jwt__SecretKey
              value: $(JWT_SECRET)
            - name: Jwt__Issuer
              value: $(JWT_ISSUER)
            - name: Jwt__Audience
              value: $(JWT_AUDIENCE)
            - name: RabbitMqAudit__Host
              value: $(RABBITMQ_HOST)
            - name: RabbitMqAudit__Port
              value: $(RABBITMQ_PORT)
            - name: RabbitMqAudit__Username
              value: $(RABBITMQ_USER)
            - name: RabbitMqAudit__Password
              value: $(RABBITMQ_PASS)
            - name: RabbitMqAudit__Exchange
              value: audit.events
            - name: RabbitMqAudit__DomainExchange
              value: relativa.domain
            - name: Smtp__Host
              value: $(SMTP_HOST)
            - name: Smtp__Port
              value: $(SMTP_PORT)
            - name: Smtp__FromAddress
              value: $(SMTP_FROM_ADDRESS)
            - name: Smtp__FromName
              value: $(SMTP_FROM_NAME)
            - name: Smtp__UseSsl
              value: $(SMTP_USE_SSL)
            - name: App__FrontendBaseUrl
              value: $(APP_FRONTEND_BASE_URL)
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 3
