apiVersion: v1
kind: Service
metadata:
  name: {{ include "relativa.componentName" (list . "rabbitmq") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "relativa.componentLabels" (list . "rabbitmq") | nindent 4 }}
spec:
  type: {{ .Values.rabbitmq.service.type }}
  selector:
    {{- include "relativa.componentSelectorLabels" (list . "rabbitmq") | nindent 4 }}
  ports:
    - name: amqp
      port: {{ .Values.rabbitmq.service.ports.amqp }}
      targetPort: amqp
    - name: management
      port: {{ .Values.rabbitmq.service.ports.management }}
      targetPort: management
