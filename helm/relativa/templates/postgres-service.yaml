apiVersion: v1
kind: Service
metadata:
  name: {{ include "relativa.componentName" (list . "postgres") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "relativa.componentLabels" (list . "postgres") | nindent 4 }}
spec:
  type: {{ .Values.postgres.service.type }}
  selector:
    {{- include "relativa.componentSelectorLabels" (list . "postgres") | nindent 4 }}
  ports:
    - name: postgres
      port: {{ .Values.postgres.service.port }}
      targetPort: postgres
