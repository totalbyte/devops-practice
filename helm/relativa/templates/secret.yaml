{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "relativa.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "relativa.labels" . | nindent 4 }}
type: Opaque
data:
  DB_PASS: {{ include "relativa.secretValue" (list . "DB_PASS" .Values.secrets.dbPassword) | b64enc | quote }}
  RABBITMQ_PASS: {{ include "relativa.secretValue" (list . "RABBITMQ_PASS" .Values.secrets.rabbitmqPassword) | b64enc | quote }}
  JWT_SECRET: {{ include "relativa.secretValue" (list . "JWT_SECRET" .Values.secrets.jwtSecret) | b64enc | quote }}
{{- end }}
