apiVersion: v1
kind: Service
metadata:
  name: {{ include "relativa.componentName" (list . "audit") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "relativa.componentLabels" (list . "audit") | nindent 4 }}
spec:
  type: {{ .Values.audit.service.type }}
  selector:
    {{- include "relativa.componentSelectorLabels" (list . "audit") | nindent 4 }}
  {{- with .Values.audit.service.sessionAffinity }}
  sessionAffinity: {{ . }}
  {{- end }}
  ports:
    - name: http
      port: {{ .Values.audit.service.port }}
      targetPort: http
