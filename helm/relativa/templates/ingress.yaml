{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "relativa.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "relativa.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  rules:
    {{- range $component, $host := dict "client" .Values.ingress.hosts.client "gateway" .Values.ingress.hosts.gateway "mailhog" .Values.ingress.hosts.mailhog }}
    - host: {{ $host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "relativa.componentName" (list $ $component) }}
                port:
                  name: http
    {{- end }}
{{- end }}
