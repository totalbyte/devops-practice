apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "relativa.componentName" (list . "client") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "relativa.componentLabels" (list . "client") | nindent 4 }}
spec:
  replicas: {{ .Values.client.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "relativa.componentSelectorLabels" (list . "client") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "relativa.podLabels" (list . "client") | nindent 8 }}
      annotations:
        {{- include "relativa.configChecksum" . | nindent 8 }}
    spec:
      containers:
        - name: client
          image: {{ include "relativa.appImage" (list . .Values.client.image) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: VITE_GATEWAY_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "relativa.configMapName" . }}
                  key: VITE_GATEWAY_URL
          resources:
            {{- toYaml .Values.client.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
