apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "relativa.componentName" (list . "ml") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "relativa.componentLabels" (list . "ml") | nindent 4 }}
spec:
  replicas: {{ .Values.ml.replicaCount }}
  {{- with .Values.ml.progressDeadlineSeconds | default .Values.progressDeadlineSeconds }}
  progressDeadlineSeconds: {{ . }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "relativa.componentSelectorLabels" (list . "ml") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "relativa.podLabels" (list . "ml") | nindent 8 }}
      annotations:
        {{- include "relativa.checksums" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "relativa.migrationWaiterName" . }}
      initContainers:
        {{- include "relativa.waitForMigration" . | nindent 8 }}
        {{- include "relativa.waitForRabbitmq" . | nindent 8 }}
      containers:
        - name: ml
          image: {{ include "relativa.appImage" (list . .Values.ml.image) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8084
          envFrom:
            - configMapRef:
                name: {{ include "relativa.configMapName" . }}
          env:
            {{- include "relativa.secretEnv" (list . "DB_PASS" "DB_PASS") | nindent 12 }}
            {{- include "relativa.secretEnv" (list . "RABBITMQ_PASSWORD" "RABBITMQ_PASS") | nindent 12 }}
            - name: DJANGO_SETTINGS_MODULE
              value: relativa_ml.settings
          resources:
            {{- toYaml .Values.ml.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /api/ml/health/
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/ml/health/
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
